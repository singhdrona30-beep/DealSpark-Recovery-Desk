name: Activate DealSpark Inbound Phone

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/activate-dealspark-phone.yml"

permissions:
  contents: read

jobs:
  configure-inbound-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Check LiveKit credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          for key in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Install LiveKit CLI
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          command -v lk

      - name: Repair inbound routing without releasing the phone number
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          lk project add dealspark-ci --url "$LIVEKIT_URL" --api-key "$LIVEKIT_API_KEY" --api-secret "$LIVEKIT_API_SECRET" --default

          lk number list --json > /tmp/numbers.json
          cat /tmp/numbers.json
          mapfile -t numbers < <(jq -r '
            .items[]?
            | select((.status == "active") or (.status == "PHONE_NUMBER_STATUS_ACTIVE") or (.status == 1))
            | select((.e164Format // .phoneNumber // .phone_number // "") != "")
            | [(.id // .phoneNumberId // .phone_number_id // ""),
               (.e164Format // .phoneNumber // .phone_number // ""),
               ((.sipDispatchRuleIds // .sip_dispatch_rule_ids // []) | join(","))]
            | join("|")
          ' /tmp/numbers.json | sort -u)
          if [ "${#numbers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one active LiveKit phone number; found ${#numbers[@]}."
            exit 1
          fi
          IFS='|' read -r phone_id phone_number attached_rule_ids <<< "${numbers[0]}"
          test -n "$phone_id" && test -n "$phone_number"
          echo "Active phone retained: $phone_number ($phone_id)"

          lk sip dispatch list --json > /tmp/dispatch-before.json
          cat /tmp/dispatch-before.json
          mapfile -t good_rules < <(jq -r '
            .items[]?
            | select((.name // "") == "dealspark-inbound")
            | select((.rule.dispatchRuleIndividual.roomPrefix // "") == "dealspark-call-")
            | select(any(.roomConfig.agents[]?; .agentName == "dealspark-receptionist"))
            | .sipDispatchRuleId // empty
          ' /tmp/dispatch-before.json | sort -u)
          if [ "${#good_rules[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one correctly configured receptionist rule; found ${#good_rules[@]}. Refusing to delete or recreate rules automatically."
            exit 1
          fi
          good_rule_id="${good_rules[0]}"
          echo "Correct receptionist rule found: $good_rule_id"

          if [ -n "$attached_rule_ids" ] && [[ "$attached_rule_ids" == *,* ]]; then
            echo "::error::Multiple rules are attached to the active number; stopping safely."
            exit 1
          fi

          if [ -n "$attached_rule_ids" ] && [ "$attached_rule_ids" != "$good_rule_id" ]; then
            if ! jq -e --arg id "$attached_rule_ids" '.items[]? | select(.sipDispatchRuleId == $id)' /tmp/dispatch-before.json >/dev/null; then
              echo "::error::Attached rule $attached_rule_ids was not found in the dispatch list; refusing to change routing."
              exit 1
            fi
            echo "Removing only the malformed dispatch rule $attached_rule_ids; the phone number itself will not be released."
            lk sip dispatch delete --id "$attached_rule_ids"
          fi

          lk number update --id "$phone_id" --sip-dispatch-rule-id "$good_rule_id"

          echo "Verifying receptionist rule and number assignment."
          lk sip dispatch list --json > /tmp/dispatch-after.json
          jq -e --arg id "$good_rule_id" '
            .items[]
            | select(.sipDispatchRuleId == $id)
            | select(.rule.dispatchRuleIndividual.roomPrefix == "dealspark-call-")
            | select(any(.roomConfig.agents[]?; .agentName == "dealspark-receptionist"))
          ' /tmp/dispatch-after.json

          lk number list --json > /tmp/numbers-after.json
          jq -e --arg id "$phone_id" --arg rule "$good_rule_id" '
            .items[]?
            | select(.id == $id)
            | select((.sipDispatchRuleIds // .sip_dispatch_rule_ids // []) | index($rule))
          ' /tmp/numbers-after.json
          echo "Dispatch rule and phone binding verified. A real test call is still required to confirm the agent answers."
