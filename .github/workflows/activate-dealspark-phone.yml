name: Activate DealSpark Inbound Phone

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/activate-dealspark-phone.yml"

permissions:
  contents: read

jobs:
  configure-inbound-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Check LiveKit credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          for key in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Install LiveKit CLI
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          echo "$HOME/.livekit/bin" >> "$GITHUB_PATH"
          command -v lk || true

      - name: Create or reuse DealSpark dispatch rule and assign the only active number
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # Configure the CLI with the existing project credentials.
          export LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET

          echo "Checking existing LiveKit phone numbers before making changes."
          lk number list --json > /tmp/livekit-numbers.json
          cat /tmp/livekit-numbers.json

          echo "This workflow deliberately stops if it cannot safely identify exactly one active number."
          echo "No phone number is purchased and no billing action is performed."
          echo "If the CLI output schema differs, the run will stop rather than guess."

          # Keep this step conservative: only continue when the CLI returns one active number.
          mapfile -t numbers < <(jq -r '
            .. | objects
            | select((has("phone_number") or has("phoneNumber")) and (has("id") or has("phone_number_id") or has("phoneNumberId")))
            | select((.status == "active") or (.status == "PHONE_NUMBER_STATUS_ACTIVE") or (.status == 1))
            | [(.id // .phone_number_id // .phoneNumberId), (.phone_number // .phoneNumber)]
            | @tsv
          ' /tmp/livekit-numbers.json | sort -u)

          if [ "${#numbers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one active LiveKit phone number; found ${#numbers[@]}. Stopping safely."
            exit 1
          fi

          IFS=$'\t' read -r phone_id phone_number <<< "${numbers[0]}"
          if [ -z "$phone_id" ] || [ -z "$phone_number" ]; then
            echo "::error::Could not reliably identify the active phone number. Stopping safely."
            exit 1
          fi

          cat > /tmp/dealspark-dispatch-rule.json <<'JSON'
          {
            "name": "dealspark-inbound",
            "rule": {
              "dispatchRuleIndividual": {
                "roomPrefix": "dealspark-call-"
              }
            },
            "roomConfig": {
              "agents": [
                {
                  "agentName": "dealspark-receptionist"
                }
              ]
            }
          }
          JSON

          echo "Creating the DealSpark inbound dispatch rule."
          # The LiveKit CLI reads the rule definition from this JSON file.
          lk sip dispatch create /tmp/dealspark-dispatch-rule.json

          echo "Dispatch rule creation requested. Listing rules to verify the rule ID."
          lk sip dispatch list --json > /tmp/livekit-dispatch-rules.json
          cat /tmp/livekit-dispatch-rules.json

          mapfile -t rule_ids < <(jq -r '
            .. | objects
            | select((.name // "") == "dealspark-inbound")
            | (.sip_dispatch_rule_id // .sipDispatchRuleId // .id // empty)
          ' /tmp/livekit-dispatch-rules.json | sort -u)

          if [ "${#rule_ids[@]}" -ne 1 ]; then
            echo "::error::Could not uniquely verify the DealSpark dispatch rule. Number assignment was not attempted."
            exit 1
          fi

          echo "Assigning the verified rule to active phone number $phone_number."
          lk number update --number "$phone_number" --sip-dispatch-rule-id "${rule_ids[0]}"

          echo "Verifying the number now uses the DealSpark dispatch rule."
          lk number list --json > /tmp/livekit-numbers-after.json
          jq -e --arg number "$phone_number" --arg rule "${rule_ids[0]}" '
            .. | objects
            | select((.phone_number // .phoneNumber // "") == $number)
            | select((.sip_dispatch_rule_id // .sipDispatchRuleId // "") == $rule)
          ' /tmp/livekit-numbers-after.json

          echo "Dispatch rule assignment verified. A real call is still required to confirm the agent answers."
