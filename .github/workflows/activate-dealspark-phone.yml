name: Activate DealSpark Inbound Phone

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/activate-dealspark-phone.yml"

permissions:
  contents: read

jobs:
  configure-inbound-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Check LiveKit credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          for key in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Install LiveKit CLIs
        run: |
          set -euo pipefail
          curl -sSL https://get.livekit.io/cli | bash
          command -v lk
          mkdir -p /tmp/livekit-cli
          curl -fsSL https://github.com/livekit/livekit-cli/releases/download/v2.4.9/lk_2.4.9_linux_amd64.tar.gz -o /tmp/lk-legacy.tar.gz
          tar -xzf /tmp/lk-legacy.tar.gz -C /tmp/livekit-cli
          legacy_path="$(find /tmp/livekit-cli -type f -name lk -print -quit)"
          test -n "$legacy_path"
          install "$legacy_path" /usr/local/bin/lk-legacy
          lk --version
          lk-legacy --version

      - name: Repair inbound routing without releasing the phone number
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          lk project add dealspark-ci --url "$LIVEKIT_URL" --api-key "$LIVEKIT_API_KEY" --api-secret "$LIVEKIT_API_SECRET" --default

          lk number list --json > /tmp/numbers.json
          cat /tmp/numbers.json
          mapfile -t numbers < <(jq -r '
            .items[]?
            # Use the known provisioned DealSpark number even if LiveKit reports
            # OFFLINE while its dispatch binding is missing.
            | select((.id // .phoneNumberId // .phone_number_id // "") == "PN_PPN_mNHDqgXbUB8Q")
            | select((.e164Format // .phoneNumber // .phone_number // "") != "")
            | [(.id // .phoneNumberId // .phone_number_id // ""),
               (.e164Format // .phoneNumber // .phone_number // ""),
               ((.sipDispatchRuleIds // .sip_dispatch_rule_ids // []) | join(","))]
            | join("|")
          ' /tmp/numbers.json | sort -u)
          if [ "${#numbers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one provisioned DealSpark phone number; found ${#numbers[@]}."
            exit 1
          fi
          IFS='|' read -r phone_id phone_number attached_rule_ids <<< "${numbers[0]}"
          test -n "$phone_id" && test -n "$phone_number"
          echo "Provisioned phone selected for routing: $phone_number ($phone_id)"

          lk sip dispatch list --json > /tmp/dispatch-before.json
          cat /tmp/dispatch-before.json

          # The existing rules conflict. Remove only those two dispatch rules,
          # then create one explicit rule tied to the active phone's trunk.
          mapfile -t conflicting_rules < <(jq -r '
            .items[]?
            | select((.sipDispatchRuleId // "") == "SDR_3LfzEeYd7rmQ"
                  or (.sipDispatchRuleId // "") == "SDR_E8XKvbVXEZTe")
            | .sipDispatchRuleId
          ' /tmp/dispatch-before.json | sort -u)
          if [ "${#conflicting_rules[@]}" -lt 1 ]; then
            echo "::error::Expected existing conflicting dispatch rules were not found; stopping safely."
            exit 1
          fi
          for old_rule in "${conflicting_rules[@]}"; do
            echo "Removing conflicting dispatch rule: $old_rule"
            lk sip dispatch delete "$old_rule"
          done

          jq -n --arg trunk "$phone_id" '{
            name: "dealspark-inbound",
            trunkIds: [$trunk],
            rule: {dispatchRuleIndividual: {roomPrefix: "dealspark-call-"}},
            roomConfig: {agents: [{agentName: "dealspark-receptionist"}]}
          }' > /tmp/dealspark-dispatch-rule.json

          echo "Creating a clean dispatch rule for the active phone trunk."
          lk-legacy sip dispatch create /tmp/dealspark-dispatch-rule.json

          lk sip dispatch list --json > /tmp/dispatch-created.json
          mapfile -t created_rules < <(jq -r --arg trunk "$phone_id" '
            .items[]?
            | select((.name // "") == "dealspark-inbound")
            | select((.rule.dispatchRuleIndividual.roomPrefix // "") == "dealspark-call-")
            | select(any(.roomConfig.agents[]?; .agentName == "dealspark-receptionist"))
            | select((.trunkIds // .trunk_ids // []) | index($trunk))
            | .sipDispatchRuleId // empty
          ' /tmp/dispatch-created.json | sort -u)
          if [ "${#created_rules[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one new explicit receptionist rule for this phone trunk; found ${#created_rules[@]}."
            cat /tmp/dispatch-created.json
            exit 1
          fi
          rule_id="${created_rules[0]}"
          echo "Created receptionist dispatch rule: $rule_id"

          lk number update --id "$phone_id" --sip-dispatch-rule-id "$rule_id"

          echo "Verifying receptionist rule and number assignment."
          lk sip dispatch list --json > /tmp/dispatch-after.json
          jq -e --arg id "$rule_id" '
            .items[]
            | select(.sipDispatchRuleId == $id)
            | select(.rule.dispatchRuleIndividual.roomPrefix == "dealspark-call-")
            | select(any(.roomConfig.agents[]?; .agentName == "dealspark-receptionist"))
          ' /tmp/dispatch-after.json

          lk number list --json > /tmp/numbers-after.json
          jq -e --arg id "$phone_id" --arg rule "$rule_id" '
            .items[]?
            | select(.id == $id)
            | select((.sipDispatchRuleIds // .sip_dispatch_rule_ids // []) | index($rule))
          ' /tmp/numbers-after.json
          echo "Dispatch rule and phone binding verified. A real test call is still required to confirm the agent answers."
