name: DealSpark Prospect Radar

on:
  schedule:
    - cron: "17 13 * * 1-5"
    - cron: "47 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-prospects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public GitHub prospect signals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, urllib.parse, urllib.request, datetime
          terms = {
            "hvac": ["hvac business","hvac company","heating cooling business"],
            "plumbing": ["plumbing business","plumbing company","plumber business"],
            "roofing": ["roofing company","roofing business","roofing contractor"],
            "cleaning": ["cleaning company","cleaning business","janitorial business"],
            "dental": ["dental clinic","dentist clinic","dental practice"],
            "landscaping": ["landscaping company","landscaping business","landscape contractor"]
          }
          token = __import__("os").environ.get("GH_TOKEN","")
          out=[]; seen=set()
          for industry, qs in terms.items():
            for q in qs:
              url="https://api.github.com/search/repositories?per_page=10&q="+urllib.parse.quote(q)
              req=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token})
              with urllib.request.urlopen(req,timeout=30) as r:
                data=json.load(r)
              for x in data.get("items",[]):
                if x["full_name"] in seen: continue
                seen.add(x["full_name"])
                out.append({
                  "industry":industry,
                  "repository":x["full_name"],
                  "owner":x.get("owner",{}).get("login",""),
                  "description":x.get("description") or "",
                  "stars":x.get("stargazers_count",0),
                  "url":x.get("html_url",""),
                  "owner_url":x.get("owner",{}).get("html_url",""),
                  "review_required":True
                })
          payload={"generated_at":datetime.datetime.utcnow().isoformat()+"Z","source":"GitHub public repository search","prospects":out}
          open("data/github-prospects.json","w").write(json.dumps(payload,indent=2))
          PY

      - name: Commit refreshed prospect signals
        run: |
          git config user.name "DealSpark Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-prospects.json
          git diff --cached --quiet || git commit -m "Refresh public prospect signals"
          git push
