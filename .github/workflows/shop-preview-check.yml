name: Validate DealSpark shop preview

on:
  push:
    branches: [main]
    paths:
      - "shop-preview/**"
      - "index.html"
      - "products.json"
      - ".github/workflows/shop-preview-check.yml"
  pull_request:
    paths:
      - "shop-preview/**"
      - ".github/workflows/shop-preview-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and storefront release gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("shop-preview")
          html = (root / "index.html").read_text(encoding="utf-8")
          assert "<!doctype html>" in html.lower(), "Storefront HTML doctype is missing"
          assert 'name="viewport"' in html, "Mobile viewport meta tag is missing"
          for section in ("categories", "products", "promise"):
              assert f'id="{section}"' in html, f"Missing required section: {section}"
          data = json.loads((root / "products.json").read_text(encoding="utf-8"))
          products = data if isinstance(data, list) else data.get("products", [])
          assert isinstance(products, list), "products.json must contain a product array"
          required = ("title", "image", "price", "productUrl")
          approved = 0
          for i, p in enumerate(products):
              if p.get("status") != "approved":
                  continue
              missing = [k for k in required if not p.get(k)]
              gates = ("costVerified", "shippingVerified", "stockVerified")
              missing += [k for k in gates if p.get(k) is not True]
              if missing:
                  raise SystemExit(f"Product {i} is marked approved but fails gates: {', '.join(missing)}")
              if not str(p["image"]).startswith("https://"):
                  raise SystemExit(f"Product {i} image must use HTTPS")
              if not str(p["productUrl"]).startswith("https://"):
                  raise SystemExit(f"Product {i} productUrl must use HTTPS")
              try:
                  if float(p["price"]) <= 0:
                      raise ValueError()
              except (TypeError, ValueError):
                  raise SystemExit(f"Product {i} has an invalid customer price")
              approved += 1
          root_html = Path("index.html").read_text(encoding="utf-8")
          root_data = json.loads(Path("products.json").read_text(encoding="utf-8"))
          assert root_html == html, "Root storefront and shop-preview must stay in sync"
          assert root_data == data, "Root catalog and shop-preview catalog must stay in sync"
          print(f"PASS: root and preview storefronts match; catalog structure valid; {approved} approved product(s).")
          if approved == 0:
              print("INFO: no products are published; this is intentional until cost, shipping and stock checks pass.")
          PY
