name: Notify search engines with IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET

          sitemap = "https://singhdrona30-beep.github.io/DealSpark-Recovery-Desk/sitemap.xml"
          key = open("indexnow-key.txt", "r", encoding="utf-8").read().strip()
          xml = urllib.request.urlopen(sitemap, timeout=30).read()
          root = ET.fromstring(xml)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [x.text.strip() for x in root.findall("sm:url/sm:loc", ns) if x.text]

          if not urls:
              raise SystemExit("No URLs found in sitemap")

          payload = json.dumps({
              "host": "singhdrona30-beep.github.io",
              "key": key,
              "keyLocation": "https://singhdrona30-beep.github.io/DealSpark-Recovery-Desk/indexnow-key.txt",
              "urlList": urls
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as resp:
              print("IndexNow response:", resp.status)
              print(resp.read().decode("utf-8", errors="replace"))
          print(f"Submitted {len(urls)} sitemap URLs")
          PY
