name: BillGuard Personal PWA smoke test
on:
  push:
    branches: [main]
    paths:
      - "billguard-personal/**"
      - ".github/workflows/billguard-personal-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/billguard-http.log 2>&1 &
      - name: Test core bill workflow
        run: node billguard-personal/browser-test.cjs
