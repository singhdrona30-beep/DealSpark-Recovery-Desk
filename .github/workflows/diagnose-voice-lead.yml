name: Diagnose DealSpark Voice Lead Saving

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-voice-lead.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test authenticated voice lead capture end-to-end
        env:
          VOICE_AGENT_TOKEN: ${{ secrets.VOICE_AGENT_TOKEN }}
          DEALSPARK_BUSINESS_ID: ${{ secrets.DEALSPARK_BUSINESS_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "72b0a6d76cd42aa06a1a54f7140c7696"
          DEALSPARK_API_URL: https://dealspark-api.singhdrona30.workers.dev
        run: |
          set -euo pipefail
          if [ -z "$VOICE_AGENT_TOKEN" ] || [ -z "$DEALSPARK_BUSINESS_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Required Actions secret is missing (token/business ID/Cloudflare API token). Values are intentionally not printed."
            exit 1
          fi

          marker="VOICE_CAPTURE_SMOKE_TEST_$(date -u +%Y%m%dT%H%M%SZ)"
          payload="$(jq -n --arg business_id "$DEALSPARK_BUSINESS_ID" --arg marker "$marker" '{
            business_id: $business_id,
            name: "Automated voice capture smoke test",
            phone: "TEST-NOT-A-REAL-CALL",
            service: "Automated API/database verification",
            email: "",
            appointment_preference: "",
            notes: $marker,
            intent: "diagnostic"
          }')"

          set +e
          response="$(curl --silent --show-error --max-time 20 -w '\nHTTP_STATUS:%{http_code}' \
            -X POST "$DEALSPARK_API_URL/api/voice-leads" \
            -H "content-type: application/json" \
            -H "authorization: Bearer $VOICE_AGENT_TOKEN" \
            --data "$payload")"
          curl_status=$?
          set -e

          body="$(printf '%s' "$response" | sed '/HTTP_STATUS:/,$d')"
          http_status="$(printf '%s' "$response" | sed -n 's/^HTTP_STATUS://p' | tail -n 1)"
          echo "Voice lead endpoint HTTP status: ${http_status:-unknown}"
          echo "Response body: $body"

          # Remove only the synthetic diagnostic lead and its event records.
          npx --yes wrangler@4.43.0 d1 execute dealspark --remote --command "DELETE FROM events WHERE lead_id IN (SELECT id FROM leads WHERE notes LIKE '%$marker%')" || true
          npx --yes wrangler@4.43.0 d1 execute dealspark --remote --command "DELETE FROM leads WHERE notes LIKE '%$marker%'" || true

          if [ "$curl_status" -ne 0 ]; then
            echo "::error::Could not reach the voice lead endpoint (curl exit $curl_status)."
            exit 1
          fi
          if [ "$http_status" != "201" ] || ! printf '%s' "$body" | jq -e '.ok == true and (.lead_id | type == "string")' >/dev/null; then
            echo "::error::Voice lead smoke test failed. See HTTP status and sanitized response above."
            exit 1
          fi
          echo "PASS: authentication, business lookup, lead insert, event insert, and success response all worked."
