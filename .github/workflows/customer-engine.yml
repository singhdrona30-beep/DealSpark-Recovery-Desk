name: DealSpark Customer Engine

on:
  schedule:
    - cron: "15 14 * * 1-5"
    - cron: "15 19 * * 1-5"
  workflow_dispatch:
    inputs:
      send:
        description: "Enable sending only when an approved email provider is configured"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  prospect-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover fresh business signals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, datetime, pathlib, re

          industries = {
            "hvac": ["HVAC contractor", "heating cooling contractor"],
            "plumbing": ["plumbing contractor", "plumbing company"],
            "roofing": ["roofing contractor", "roofing company"],
            "cleaning": ["cleaning company", "commercial cleaning"],
            "dental": ["dental practice", "dentist office"],
            "landscaping": ["landscaping contractor", "landscaping company"],
            "towing": ["towing company", "roadside assistance"],
            "auto": ["auto dealership", "auto finance"]
          }

          token = os.environ.get("GH_TOKEN", "")
          seen = set()
          leads = []

          for industry, queries in industries.items():
              for q in queries:
                  url = "https://api.github.com/search/repositories?per_page=8&q=" + urllib.parse.quote(q)
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": "Bearer " + token,
                          "User-Agent": "DealSpark-Customer-Engine"
                      }
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = json.load(r)
                  except Exception:
                      continue

                  for item in data.get("items", []):
                      full = item.get("full_name", "")
                      if not full or full in seen:
                          continue
                      seen.add(full)
                      owner = item.get("owner", {})
                      name = full.split("/", 1)[-1].replace("-", " ").replace("_", " ").strip()
                      leads.append({
                          "industry": industry,
                          "company_hint": name.title(),
                          "repository": full,
                          "description": item.get("description") or "",
                          "stars": item.get("stargazers_count", 0),
                          "url": item.get("html_url", ""),
                          "owner_url": owner.get("html_url", ""),
                          "status": "review_required"
                      })

          leads = leads[:80]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()

          pathlib.Path("data").mkdir(exist_ok=True)
          payload = {"generated_at": now, "source": "GitHub public repository signals", "leads": leads}
          pathlib.Path("data/customer-leads.json").write_text(json.dumps(payload, indent=2))

          # Build concise human-review drafts. Never invent an email address.
          out = []
          for lead in leads:
              company = lead["company_hint"]
              industry = lead["industry"]
              subject = f"Quick idea for {company}"
              body = (
                  f"Hi there,\\n\\n"
                  f"I'm Drona Singh with DealSpark. We help {industry} businesses "
                  f"capture missed calls and new inquiries with an AI virtual receptionist "
                  f"that can qualify leads and help book appointments.\\n\\n"
                  f"If missed calls or after-hours inquiries are costing you opportunities, "
                  f"I'd be happy to show you the live DealSpark demo: "
                  f"https://singhdrona30-beep.github.io/DealSpark-Recovery-Desk/\\n\\n"
                  f"Would a quick look be useful?\\n\\n"
                  f"Drona Singh\\nDealSpark"
              )
              out.append({
                  "company": company,
                  "industry": industry,
                  "source_url": lead["url"],
                  "subject": subject,
                  "body": body,
                  "status": "draft_only"
              })

          pathlib.Path("data/outreach-queue.json").write_text(
              json.dumps({"generated_at": now, "queue": out}, indent=2)
          )
          PY

      - name: Commit customer acquisition queue
        run: |
          git config user.name "DealSpark Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/customer-leads.json data/outreach-queue.json
          git diff --cached --quiet || git commit -m "Refresh DealSpark customer acquisition queue"
          git push

  send-approved:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.send == 'true' }}
    runs-on: ubuntu-latest
    needs: prospect-and-prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check approved provider configuration
        env:
          OUTREACH_PROVIDER: ${{ secrets.OUTREACH_PROVIDER }}
          OUTREACH_API_URL: ${{ secrets.OUTREACH_API_URL }}
          OUTREACH_API_KEY: ${{ secrets.OUTREACH_API_KEY }}
        run: |
          if [ -z "$OUTREACH_PROVIDER" ] || [ -z "$OUTREACH_API_URL" ] || [ -z "$OUTREACH_API_KEY" ]; then
            echo "Sending is intentionally disabled: no approved email provider secrets are configured."
            echo "The workflow will only build the reviewed outreach queue."
            exit 0
          fi
          echo "Provider configuration detected. Sending integration is gated and requires provider-specific implementation."
          exit 0
