name: DealSpark Site Link Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live customer pages
        run: |
          set -e
          base="https://singhdrona30-beep.github.io/DealSpark-Recovery-Desk"
          urls=(
            "$base/"
            "$base/signup.html?plan=starter"
            "$base/chatbot.html"
            "$base/lead-recovery.html"
            "$base/quote-flow.html"
            "$base/reactivate.html"
            "$base/phone-agent.html"
            "$base/lead-radar.html"
            "$base/sales-agent.html"
            "$base/dashboard.html"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            code=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAILED: $url returned HTTP $code"
              exit 1
            fi
          done
          echo "All critical DealSpark customer pages are reachable."
