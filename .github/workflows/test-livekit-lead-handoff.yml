name: DealSpark LiveKit voice lead handoff simulation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "livekit-agent/**"
      - ".github/workflows/test-livekit-lead-handoff.yml"
      - "livekit-agent/scenarios-voice-lead.yaml"

permissions:
  contents: read

concurrency:
  group: dealspark-livekit-lead-handoff-test
  cancel-in-progress: false

jobs:
  simulate-lead-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: livekit-agent
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      VOICE_AGENT_TOKEN: ${{ secrets.VOICE_AGENT_TOKEN }}
      DEALSPARK_BUSINESS_ID: ${{ secrets.DEALSPARK_BUSINESS_ID }}
      DEALSPARK_API_URL: https://dealspark-api.singhdrona30.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Validate required credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          for key in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET VOICE_AGENT_TOKEN DEALSPARK_BUSINESS_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              exit 1
            fi
          done
          echo "All required credentials are present."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install LiveKit CLI
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          lk --version

      - name: Diagnose lead-saving tool directly without a phone call
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os
          import sys
          from agent import save_call_lead

          required = ("VOICE_AGENT_TOKEN", "DEALSPARK_BUSINESS_ID", "DEALSPARK_API_URL")
          print("Agent process environment:", {key: bool(os.getenv(key)) for key in required})
          result = asyncio.run(save_call_lead(
              name="DealSpark Automated Diagnostic",
              phone="202-555-0148",
              service="Automated diagnostic only",
              email="diagnostic@example.com",
              appointment_preference="",
              notes="VOICE_CAPTURE_SMOKE_TEST_DO_NOT_CONTACT",
          ))
          print("Lead-saving tool result:", result)
          if not result.startswith("Lead saved successfully"):
              sys.exit("Direct lead-saving tool test failed.")
          print("Direct lead-saving tool test passed.")
          PY

      - name: Verify tenant-safe inbound number routing
        shell: bash
        run: |
          set -euo pipefail
          payload='{"business_id":"","called_number":"+12402314013","is_phone_call":true,"name":"DealSpark Route QA","phone":"202-555-0147","service":"Automated inbound route test","email":"","appointment_preference":"","notes":"ROUTE_TEST_ONLY_DO_NOT_CONTACT","intent":"call"}'
          http_code="$(curl -sS -o /tmp/route-response.json -w "%{http_code}" \
            -X POST "$DEALSPARK_API_URL/api/voice-leads" \
            -H "authorization: Bearer $VOICE_AGENT_TOKEN" \
            -H "content-type: application/json" \
            -H "user-agent: DealSparkVoiceAgent/1.0" \
            --data "$payload")"
          if [ "$http_code" != "201" ]; then
            echo "::error::Dialed-number route test returned HTTP $http_code."
            cat /tmp/route-response.json
            exit 1
          fi
          jq -e '.ok == true and .business_id == "65e080fb-8e38-4785-9193-a9a0898556f8" and .notification_status == "not_configured"' /tmp/route-response.json
          echo "Known demo DID routes to the demo tenant without using the global business ID."

          missing_number='{"business_id":"","called_number":"","is_phone_call":true,"name":"No Route QA","phone":"202-555-0146","service":"Missing route rejection test","notes":"ROUTE_TEST_ONLY_DO_NOT_CONTACT"}'
          missing_code="$(curl -sS -o /tmp/missing-route-response.json -w "%{http_code}" \
            -X POST "$DEALSPARK_API_URL/api/voice-leads" \
            -H "authorization: Bearer $VOICE_AGENT_TOKEN" \
            -H "content-type: application/json" \
            --data "$missing_number")"
          if [ "$missing_code" != "422" ]; then
            echo "::error::Missing dialed-number test should fail safely with HTTP 422, got $missing_code."
            cat /tmp/missing-route-response.json
            exit 1
          fi
          echo "Calls without a dialed number are rejected safely instead of falling back to the demo tenant."

      - name: Run one synthetic text conversation and verify transcript evidence
        shell: bash
        run: |
          set -uo pipefail
          set +e
          lk agent simulate text --scenarios scenarios-voice-lead.yaml --concurrency 1 --yes 2>&1 | tee /tmp/dealspark-voice-simulation.log
          cli_status=${PIPESTATUS[0]}
          set -e

          # LiveKit's LLM summary has previously contradicted its own transcript.
          # Treat the actual tool-call and tool-result lines as authoritative evidence.
          if ! grep -q '\[call\] save_call_lead(' /tmp/dealspark-voice-simulation.log; then
            echo "::error::Synthetic transcript did not contain the save_call_lead invocation."
            exit 1
          fi
          if ! grep -q '\[output\] save_call_lead -> Lead saved successfully' /tmp/dealspark-voice-simulation.log; then
            echo "::error::Synthetic transcript did not confirm that the lead was saved."
            exit 1
          fi
          if ! grep -q 'Casey Testcaller' /tmp/dealspark-voice-simulation.log || ! grep -q 'casey.testcaller@example.com' /tmp/dealspark-voice-simulation.log; then
            echo "::error::Synthetic transcript did not retain the expected test caller details."
            exit 1
          fi
          if grep -Eiq "I've booked your appointment|your appointment is booked|your appointment is confirmed" /tmp/dealspark-voice-simulation.log; then
            echo "::error::Agent made an unsupported appointment-booking claim."
            exit 1
          fi
          echo "Transcript assertions passed. LiveKit CLI summary exit code was $cli_status; explicit transcript evidence is authoritative."

      - name: Report test scope
        if: always()
        run: |
          echo "This test uses a synthetic text caller and does not place a phone/SIP call."
          echo "A passing simulation verifies conversation/tool behavior; it does not replace a final real-phone audio test."
