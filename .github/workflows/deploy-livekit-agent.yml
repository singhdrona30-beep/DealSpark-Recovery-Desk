name: Deploy DealSpark LiveKit Agent

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealspark-livekit-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are configured
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          VOICE_AGENT_TOKEN: ${{ secrets.VOICE_AGENT_TOKEN }}
          DEALSPARK_BUSINESS_ID: ${{ secrets.DEALSPARK_BUSINESS_ID }}
        run: |
          missing=0
          for key in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET VOICE_AGENT_TOKEN DEALSPARK_BUSINESS_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Restore existing LiveKit agent configuration
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        run: |
          # Reuse the agent created by the successful first deployment.
          host="${LIVEKIT_URL#*://}"
          host="${host%%/*}"
          subdomain="${host%%.*}"
          if [ -z "$subdomain" ] || [ "$subdomain" = "$host" ]; then
            echo "::error::Could not determine LiveKit project subdomain from LIVEKIT_URL."
            exit 1
          fi
          mkdir -p livekit-agent
          cat > livekit-agent/livekit.toml <<EOF
          [project]
          subdomain = "$subdomain"

          [agent]
          id = "CA_fbBz3h6eW7xP"
          EOF
          echo "Restored configuration for the existing LiveKit agent."

      - name: Deploy existing agent to LiveKit Cloud
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          VOICE_AGENT_TOKEN: ${{ secrets.VOICE_AGENT_TOKEN }}
          DEALSPARK_BUSINESS_ID: ${{ secrets.DEALSPARK_BUSINESS_ID }}
          DEALSPARK_API_URL: ${{ vars.DEALSPARK_API_URL }}
          SECRET_LIST: "VOICE_AGENT_TOKEN,DEALSPARK_BUSINESS_ID,DEALSPARK_API_URL"
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: livekit-agent
