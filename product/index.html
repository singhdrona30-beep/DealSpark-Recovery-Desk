<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101828"><title>DealSpark — Operations Control Center</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#101828}.shell{display:flex;min-height:100vh}.side{width:245px;background:#101828;color:#fff;padding:22px;position:sticky;top:0;height:100vh}.logo{font-size:23px;font-weight:900;margin-bottom:30px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d0d5dd;border:0;padding:12px;border-radius:9px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#344054;color:#fff}.main{flex:1;padding:28px;max-width:1250px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:0;font-size:30px}.badge{background:#ecfdf3;color:#067647;padding:7px 10px;border-radius:999px;font-weight:800;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.metric{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 22px #1018280d}.metric strong{font-size:30px;display:block;margin-top:7px}.panel{background:#fff;padding:22px;border-radius:16px;box-shadow:0 5px 22px #1018280d;margin:15px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button.primary{background:#101828;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}button.secondary{background:#eef2f6;color:#101828;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.item{border:1px solid #eaecf0;border-radius:12px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;gap:15px}.item small{color:#667085}.tag{padding:5px 8px;border-radius:999px;background:#fff4e5;color:#b54708;font-size:12px;font-weight:800}.hidden{display:none}.empty{padding:30px;text-align:center;color:#667085}.notice{background:#fffaeb;border:1px solid #fedf89;padding:13px;border-radius:10px;color:#93370d}.modal{position:fixed;inset:0;background:#10182899;display:none;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;max-width:560px;width:100%;padding:25px;border-radius:16px}.modal input,.modal textarea,.modal select{width:100%;padding:11px;margin:7px 0 12px;border:1px solid #d0d5dd;border-radius:8px}.mobile{display:none}@media(max-width:900px){.side{display:none}.mobile{display:block}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cards{grid-template-columns:1fr}.item{display:block}.main{padding:16px}}</style></head><body><div class="shell"><aside class="side"><div class="logo">DealSpark</div><div class="nav"><button class="active" data-view="overview">Overview</button><button data-view="billguard">BillGuard</button><button data-view="stockwatch">StockWatch</button><button data-view="staffdesk">StaffDesk</button><button data-view="reviewshield">ReviewShield</button><button data-view="opsvault">OpsVault</button><button data-view="integrations">Integrations</button><button data-view="audit">Audit log</button></div></aside><main class="main"><div class="top"><div><div class="mobile"><b>☰ DealSpark</b></div><h1 id="title">Operations Control Center</h1><p id="sub" style="color:#667085">One action queue for the work your business software already produces.</p></div><span class="badge">MVP • SAMPLE DATA</span></div><div id="view"></div></main></div><div class="modal" id="modal"><div class="modalbox"><h2>Add operational item</h2><label>Product</label><select id="mProduct"><option>BillGuard</option><option>StockWatch</option><option>StaffDesk</option><option>ReviewShield</option><option>OpsVault</option></select><label>Item</label><input id="mItem" placeholder="e.g. Invoice #2041"><label>Issue / signal</label><textarea id="mIssue" placeholder="What needs attention?"></textarea><div class="toolbar"><button class="primary" onclick="saveItem()">Add to queue</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div></div><script>
const seed=[
{id:1,p:"BillGuard",item:"ABC Mechanical • Invoice #1842",issue:"$2,480 overdue • 17 days",status:"Needs review"},
{id:2,p:"StockWatch",item:"Northside HVAC • 16x20 filter",issue:"4 units left • reorder 20",status:"Needs review"},
{id:3,p:"StaffDesk",item:"Maria • Sales Rep",issue:"2 documents missing • training due tomorrow",status:"Needs review"},
{id:4,p:"ReviewShield",item:"Harbour Plumbing • 2-star review",issue:"Technician arrived late • urgent complaint",status:"Needs review"},
{id:5,p:"OpsVault",item:"Summit Roofing • Insurance certificate",issue:"Expires in 12 days",status:"Needs review"}];
let items=JSON.parse(localStorage.getItem("ds_items")||"null")||seed;let audit=JSON.parse(localStorage.getItem("ds_audit")||"[]");
const $=id=>document.getElementById(id);function save(){localStorage.setItem("ds_items",JSON.stringify(items));localStorage.setItem("ds_audit",JSON.stringify(audit))}
function render(view="overview"){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="overview")overview();else if(view==="integrations")integrations();else if(view==="audit")auditView();else product(view)}
function overview(){ $("title").textContent="Operations Control Center";$("sub").textContent="One action queue for the work your business software already produces.";let counts={};items.forEach(x=>counts[x.p]=(counts[x.p]||0)+1);$("view").innerHTML='<div class="cards">'+["BillGuard","StockWatch","StaffDesk","ReviewShield","OpsVault"].map(p=>'<div class="metric"><small>'+p+'</small><strong>'+(counts[p]||0)+'</strong><span>open items</span></div>').join("")+'<div class="metric"><small>Approved</small><strong>'+audit.filter(x=>x.type==="approved").length+'</strong><span>actions logged</span></div></div><div class="panel"><div class="toolbar"><button class="primary" onclick="openModal()">+ Add item</button><button class="secondary" onclick="resetDemo()">Reset sample data</button><button class="secondary" onclick="exportData()">Export JSON</button></div><div class="notice">MVP mode: data is stored in this browser. Real accounting, inventory, HR, review and document connectors are added only after OAuth/API credentials are configured.</div><h2>Priority queue</h2>'+list(items.slice(0,8))+'</div>'}
function product(p){let arr=items.filter(x=>x.p.toLowerCase()===p);$("title").textContent=p;$("sub").textContent={BillGuard:"Cash-control exceptions and invoice follow-up.",StockWatch:"Inventory signals and reorder recommendations.",StaffDesk:"Employee operations and onboarding exceptions.",ReviewShield:"Customer feedback triage and response workflow.",OpsVault:"Documents, renewals and expiry control."}[p];$("view").innerHTML='<div class="panel"><div class="toolbar"><button class="primary" onclick="openModal(\''+p+'\')">+ Add '+p+' item</button><button class="secondary" onclick="runScan(\''+p+'\')">Run AI scan</button></div><h2>Action queue</h2>'+list(arr)+'</div>'}
function list(arr){if(!arr.length)return '<div class="empty">No open items.</div>';return arr.map(x=>'<div class="item"><div><b>'+esc(x.item)+'</b><br><small>'+esc(x.issue)+'</small></div><div><span class="tag">'+esc(x.status)+'</span><div class="toolbar"><button class="primary" onclick="approve('+x.id+')">Approve</button><button class="secondary" onclick="dismiss('+x.id+')">Dismiss</button></div></div></div>').join("")}
function integrations(){$("title").textContent="Integrations";$("sub").textContent="Connect the software businesses already use.";const rows=[["Stripe","Production verified • read-only test completed"],["QuickBooks Online","OAuth required"],["Shopify","Merchant OAuth required"],["Square","Seller OAuth required"],["Xero","Tenant OAuth required"],["Google Business Profile","Google authorization required"],["Microsoft 365","Microsoft authorization required"],["Google Drive","Google authorization required"]];$("view").innerHTML='<div class="panel"><h2>Connector readiness</h2>'+rows.map(r=>'<div class="item"><div><b>'+r[0]+'</b><br><small>'+r[1]+'</small></div><span class="tag">'+(r[1].startsWith("Production")?"Verified":"Pending")+'</span></div>').join("")+'</div><div class="panel"><b>Design rule:</b> least-privilege permissions, owner approval for consequential actions, and an audit record for every execution.</div>'}
function auditView(){$("title").textContent="Audit log";$("sub").textContent="Every approval and dismissal is recorded locally in MVP mode."; $("view").innerHTML='<div class="panel">'+(audit.length?audit.slice().reverse().map(x=>'<div class="item"><div><b>'+esc(x.type.toUpperCase())+'</b><br><small>'+esc(x.text)+'</small></div><small>'+new Date(x.at).toLocaleString()+'</small></div>').join(""):'<div class="empty">No actions yet.</div>')+'</div>'}
function approve(id){let x=items.find(a=>a.id===id);if(!x)return;audit.push({type:"approved",text:x.p+" • "+x.item+" — "+x.issue,at:new Date().toISOString()});items=items.filter(a=>a.id!==id);save();render(x.p.toLowerCase())}
function dismiss(id){let x=items.find(a=>a.id===id);if(!x)return;audit.push({type:"dismissed",text:x.p+" • "+x.item,at:new Date().toISOString()});items=items.filter(a=>a.id!==id);save();render(x.p.toLowerCase())}
function runScan(p){audit.push({type:"scan",text:p+" AI scan completed in sample mode",at:new Date().toISOString()});save();alert(p+" scan complete. "+items.filter(x=>x.p===p).length+" sample items reviewed.");}
function openModal(p){$("modal").style.display="flex";if(p)$("mProduct").value=p}function closeModal(){$("modal").style.display="none"}function saveItem(){let p=$("mProduct").value,i=$("mItem").value.trim(),issue=$("mIssue").value.trim();if(!i||!issue)return;items.push({id:Date.now(),p,item:i,issue,status:"Needs review"});save();closeModal();render(p.toLowerCase())}function resetDemo(){if(confirm("Reset all MVP data?")){items=seed.map(x=>({...x}));audit=[];save();render()}}function exportData(){const b=new Blob([JSON.stringify({items,audit},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="dealspark-mvp-export.json";a.click()}function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>render(b.dataset.view));render();
</script></body></html>
