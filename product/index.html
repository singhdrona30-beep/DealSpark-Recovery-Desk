<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101828"><title>DealSpark — Operations Control Center</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}.shell{display:flex;min-height:100vh}.side{width:250px;background:#101828;color:#fff;padding:22px;position:fixed;inset:0 auto 0 0}.brand{font-size:24px;font-weight:900;letter-spacing:-.04em;margin-bottom:7px}.side small{color:#98a2b3}.nav{margin-top:28px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px;border-radius:10px;margin:5px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#344054;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:30px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.top h1{margin:0;font-size:32px;letter-spacing:-.04em}.top p{color:#667085;margin:8px 0}.status{background:#ecfdf3;color:#067647;border:1px solid #abefc6;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:22px 0}.metric,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 8px 28px #1018280a}.metric{padding:18px}.metric span{color:#667085;font-size:12px}.metric strong{display:block;font-size:28px;margin-top:8px}.panel{padding:22px;margin:15px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.primary,.secondary,.danger{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#101828;color:#fff}.secondary{background:#eef2f6;color:#172033}.danger{background:#fee4e2;color:#b42318}.item{display:flex;justify-content:space-between;gap:20px;border:1px solid #eaecf0;border-radius:13px;padding:16px;margin:10px 0;background:#fff}.item b{font-size:15px}.muted{color:#667085;font-size:13px;line-height:1.5}.tag{display:inline-block;background:#fff4e5;color:#b54708;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.ok{background:#ecfdf3;color:#067647}.empty{text-align:center;padding:35px;color:#667085}.notice{padding:13px 15px;border:1px solid #b2ddff;background:#eff8ff;color:#175cd3;border-radius:10px}.modal,.auth{position:fixed;inset:0;background:#101828cc;display:flex;align-items:center;justify-content:center;padding:20px}.modal{display:none}.box{background:#fff;width:min(520px,100%);padding:26px;border-radius:18px;box-shadow:0 25px 80px #0004}.box h2{margin-top:0}.box input,.box select,.box textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0 14px;color:#172033;background:#fff}.auth .box{width:min(430px,100%)}.authTabs{display:flex;gap:6px;margin-bottom:18px}.authTabs button{flex:1;border:1px solid #d0d5dd;background:#fff;padding:10px;border-radius:8px;cursor:pointer}.authTabs button.active{background:#101828;color:#fff}.auth label{font-size:13px;font-weight:700}.auth .hint{font-size:12px;color:#667085;margin-top:12px}.hidden{display:none!important}.mobile{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}}@media(max-width:700px){.side{display:none}.main{margin-left:0;width:100%;padding:18px}.mobile{display:block}.cards{grid-template-columns:1fr}.item{display:block}.top{display:block}.status{display:inline-block;margin-top:10px}}
</style></head>
<body>
<div id="auth" class="auth"><div class="box"><div class="brand">DealSpark</div><p class="muted">Real workspace control center</p><div class="authTabs"><button id="loginTab" class="active" onclick="authMode('login')">Sign in</button><button id="registerTab" onclick="authMode('register')">Create workspace</button></div>
<div id="registerFields" class="hidden"><label>Business name</label><input id="businessName" placeholder="ABC Mechanical"></div>
<label>Email</label><input id="email" type="email" placeholder="owner@business.com" autocomplete="email">
<label>Password</label><input id="password" type="password" placeholder="Minimum 8 characters" autocomplete="current-password">
<button class="primary" style="width:100%" onclick="submitAuth()">Continue</button><div id="authMsg" class="hint"></div></div></div>
<div class="shell hidden" id="app"><aside class="side"><div class="brand">DealSpark</div><small id="workspaceName">Operations</small><div class="nav">
<button class="active" data-view="overview">Overview</button><button data-view="billguard">BillGuard</button><button data-view="stockwatch">StockWatch</button><button data-view="staffdesk">StaffDesk</button><button data-view="reviewshield">ReviewShield</button><button data-view="opsvault">OpsVault</button><button data-view="leadflow">LeadFlow</button><button data-view="quotepilot">QuotePilot</button><button data-view="scheduleflow">ScheduleFlow</button><button data-view="dispatchdesk">DispatchDesk</button><button data-view="assetcare">AssetCare</button><button data-view="integrations">Integrations</button><button data-view="audit">Audit log</button></div><div style="position:absolute;bottom:22px;left:22px;right:22px"><button class="secondary" style="width:100%" onclick="logout()">Sign out</button></div></aside>
<main class="main"><div class="top"><div><div class="mobile"><b>DealSpark</b></div><h1 id="title">Operations Control Center</h1><p id="sub">Persistent business operations, approval and audit workflow.</p></div><span class="status" id="status">PRODUCTION API • CONNECTED</span></div><div id="view"></div></main></div>
<div class="modal" id="modal"><div class="box"><h2>Add operational item</h2><label>Product</label><select id="mProduct"><option>BillGuard</option><option>StockWatch</option><option>StaffDesk</option><option>ReviewShield</option><option>OpsVault</option><option>LeadFlow</option><option>QuotePilot</option><option>ScheduleFlow</option><option>DispatchDesk</option><option>AssetCare</option></select><label>Item</label><input id="mItem" placeholder="Invoice #2041"><label>Issue / signal</label><textarea id="mIssue" placeholder="What needs attention?"></textarea><div class="toolbar"><button class="primary" onclick="saveItem()">Add to workspace</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div></div>
<script>
const API="https://dealspark-saas.singhdrona30.workers.dev";
let token=localStorage.getItem("ds_token")||"",mode="login",items=[],audit=[];
const $=id=>document.getElementById(id);
function authMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("registerTab").classList.toggle("active",m==="register");$("registerFields").classList.toggle("hidden",m!=="register");$("authMsg").textContent="";}
async function api(path,opts={}){opts.headers=Object.assign({"content-type":"application/json"},opts.headers||{});if(token)opts.headers.authorization="Bearer "+token;const r=await fetch(API+path,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function submitAuth(){const email=$("email").value.trim(),password=$("password").value;try{let d;if(mode==="register"){d=await api("/api/auth/register",{method:"POST",body:JSON.stringify({email,password,business_name:$("businessName").value.trim()})})}else d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email,password})});token=d.token;localStorage.setItem("ds_token",token);$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("workspaceName").textContent=d.workspace?.name||"Operations";await load();render("overview")}catch(e){$("authMsg").textContent=e.message}}
async function load(){const d=await api("/api/items");items=d.items||[];try{const a=await api("/api/audit");audit=a.audit||[]}catch{}try{const r=await api("/api/recovery");$("status").textContent=(r.safe_mode?"SAFE MODE":"PRODUCTION API")+" • v"+r.version+" • "+r.product_count+" PRODUCTS"}catch{}}
function logout(){localStorage.removeItem("ds_token");location.reload()}
function render(view="overview"){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="overview")overview();else if(view==="integrations")integrations();else if(view==="audit")auditView();else product(view)}
function overview(){const counts={};items.filter(x=>x.status==="needs_review").forEach(x=>counts[x.product]=(counts[x.product]||0)+1);$("title").textContent="Operations Control Center";$("sub").textContent="Persistent business operations, approval and audit workflow.";$("view").innerHTML='<div class="cards">'+["BillGuard","StockWatch","StaffDesk","ReviewShield","OpsVault","LeadFlow","QuotePilot","ScheduleFlow","DispatchDesk","AssetCare"].map(p=>'<div class="metric"><span>'+p+'</span><strong>'+(counts[p]||0)+'</strong><span>open items</span></div>').join("")+'</div><div class="panel"><div class="toolbar"><button class="primary" onclick="openModal()">+ Add item</button><button class="secondary" onclick="load().then(()=>render())">Refresh</button></div><div class="notice">Safe mode: items, approvals and audit events are stored in your workspace. No external business systems are changed automatically; live connectors require authorization and testing.</div><h2>Priority queue</h2>'+list(items.filter(x=>x.status==="needs_review"))+'</div>'}
function product(p){const labels={BillGuard:"Invoice and cash-flow exceptions.",StockWatch:"Inventory and reorder signals.",StaffDesk:"Employee administration and onboarding.",ReviewShield:"Customer feedback triage and response workflow.",OpsVault:"Documents, renewals and expiry control.",LeadFlow:"Lead intake, qualification and follow-up control.",QuotePilot:"Quote-ready request and scope organization.",ScheduleFlow:"Appointment and schedule exception control.",DispatchDesk:"Field job and technician coordination.",AssetCare:"Equipment maintenance and service tracking."};const key=Object.keys(labels).find(k=>k.toLowerCase()===p)||p;const arr=items.filter(x=>x.product.toLowerCase()===p);$("title").textContent=key;$("sub").textContent=labels[key]||"Operations workflow.";$("view").innerHTML='<div class="panel"><div class="toolbar"><button class="primary" onclick="openModal(\''+p+'\')">+ Add item</button><button class="secondary" onclick="load().then(()=>render(\''+p.toLowerCase()+'\'))">Refresh</button></div><h2>Action queue</h2>'+list(arr.filter(x=>x.status==="needs_review"))+'</div>'}
function list(arr){if(!arr.length)return '<div class="empty">No open items.</div>';return arr.map(x=>'<div class="item"><div><b>'+esc(x.item)+'</b><div class="muted">'+esc(x.issue)+'</div><span class="tag">'+esc(x.product)+'</span></div><div class="toolbar"><button class="primary" onclick="act(\''+x.id+'\',\'approve\')">Approve</button><button class="secondary" onclick="act(\''+x.id+'\',\'dismiss\')">Dismiss</button></div></div>').join("")}
async function act(id,action){try{await api("/api/items/"+id+"/"+action,{method:"POST"});await load();render()}catch(e){alert(e.message)}}
async function integrations(){const d=await api("/api/integrations");const rows=[["Stripe","Production connector target"],["QuickBooks Online","OAuth required"],["Shopify","Merchant OAuth required"],["Square","Seller OAuth required"],["Xero","Tenant OAuth required"],["Google Business Profile","Google authorization required"],["Microsoft 365","Microsoft authorization required"],["Google Drive","Google authorization required"]];$("title").textContent="Integrations";$("sub").textContent="Connect the software businesses already use.";const live=(d.integrations||[]).reduce((a,x)=>(a[x.provider]=x,a),{});$("view").innerHTML='<div class="panel"><h2>Connector readiness</h2>'+rows.map(r=>'<div class="item"><div><b>'+r[0]+'</b><div class="muted">'+(live[r[0]]?.status||r[1])+'</div></div><span class="tag '+(live[r[0]]?.status==="connected"?"ok":"")+'">'+(live[r[0]]?.status==="connected"?"Connected":"Setup required")+'</span></div>').join("")+'</div><div class="panel"><b>Approval rule:</b> DealSpark recommends and organizes work first. Consequential external actions require explicit authorization.</div>'}
function auditView(){$("title").textContent="Audit log";$("sub").textContent="Persistent workspace history of actions.";$("view").innerHTML='<div class="panel">'+(audit.length?audit.map(x=>'<div class="item"><div><b>'+esc(x.action.toUpperCase())+'</b><div class="muted">'+esc(x.details||"")+'</div></div><small>'+esc(x.created_at)+'</small></div>').join(""):'<div class="empty">No actions yet.</div>')+'</div>'}
function openModal(p){$("modal").style.display="flex";if(p)$("mProduct").value=p}function closeModal(){$("modal").style.display="none"}async function saveItem(){const product=$("mProduct").value,item=$("mItem").value.trim(),issue=$("mIssue").value.trim();if(!item||!issue)return;try{await api("/api/items",{method:"POST",body:JSON.stringify({product,item,issue})});closeModal();$("mItem").value="";$("mIssue").value="";await load();render(product.toLowerCase())}catch(e){alert(e.message)}}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>render(b.dataset.view));
if(token){api("/api/me").then(d=>{$("auth").classList.add("hidden");$("app").classList.remove("hidden");load().then(()=>render())}).catch(()=>{localStorage.removeItem("ds_token");token=""})}
</script><script>(function(){try{const sid=sessionStorage.getItem("ds_sid")||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());sessionStorage.setItem("ds_sid",sid);const ep="https://dealspark-analytics.singhdrona30.workers.dev";const send=(event,target)=>navigator.sendBeacon(ep,new Blob([JSON.stringify({event,session_id:sid,page:location.pathname,referrer:document.referrer||"",target:String(target||"").slice(0,1000),ts:new Date().toISOString()})],{type:"application/json"}));send("page_view",location.pathname);document.addEventListener("click",function(e){const a=e.target.closest&&e.target.closest("a");if(a){const href=a.href||"";if(/signup\.html\?plan=|buy\.stripe\.com/.test(href))send("lead_click",href);else if(/ops-lab\/.*demo|chatbot\.html/.test(href))send("demo_click",href)}},true)}catch(e){}})();</script></body></html>
