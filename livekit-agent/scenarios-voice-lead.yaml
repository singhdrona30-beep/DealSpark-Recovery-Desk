name: DealSpark voice lead capture handoff
scenarios:
  - label: Capture a caller and save the lead
    instructions: |
      You are a prospective customer calling DealSpark to ask for help with a plumbing leak.
      Your name is Casey Testcaller.
      Your callback phone number is 202-555-0149.
      Your email is casey.testcaller@example.com.
      OPENING LINE: "Hi, I need help with a leaking kitchen sink."
      Give the information naturally, one answer at a time as the receptionist asks.
      If asked for an appointment preference, say "Tuesday at 10 AM" and confirm it when read back.
      Confirm the email address if the receptionist reads it back correctly.
      Once the receptionist has your details and says a team member will follow up, politely end the conversation.
    agent_expectations: >
      The receptionist identifies itself as an AI receptionist, gathers the caller's name,
      callback number, plumbing service request, and email address, and calls the lead-saving
      tool. It must not claim an appointment is booked. The transcript's [call] save_call_lead
      line and following [output] are authoritative. If the tool output begins with "Lead saved
      successfully", the save succeeded; do not mark it as a failure just because the agent
      confirms the save after that tool result. Email notification failure does not mean the lead
      itself failed to save. Fail only if the tool is not called, the tool output says saving
      failed, or the agent claims success before the tool result.
    tags:
      feature: voice_lead_capture
      test_type: synthetic
