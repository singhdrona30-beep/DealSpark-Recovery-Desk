<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealSpark Recovery Desk</title><link rel="stylesheet" href="styles.css">
<style>.accountbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{padding:10px 12px;border-radius:10px;background:#f4f7fb}.lead{border:1px solid #e2e7ef;border-radius:12px;padding:14px;margin:10px 0}.lead b{display:block}.muted{color:#697386;font-size:13px}@media(max-width:650px){.accountbar{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="shell">
<header class="hero"><div><p class="eyebrow">DealSpark</p><h1>Recovery Desk</h1><p id="bizName">Loading account…</p></div><div><a href="product-suite.html" class="secondary" style="padding:11px;border-radius:10px;text-decoration:none">Product Suite</a> <a href="index.html" class="secondary" style="padding:11px;border-radius:10px;text-decoration:none">Product home</a> <button id="logout" class="secondary">Log out</button></div></header>
<section class="metrics"><div><span>Open</span><strong id="openCount">0</strong></div><div><span>Qualified</span><strong id="qualifiedCount">0</strong></div><div><span>Booked</span><strong id="bookedCount">0</strong></div><div><span>Won</span><strong id="wonCount">0</strong></div></section>
<section class="card"><div id="activation" class="status">Checking activation…</div><div id="renewal" class="status">Checking renewal…</div><div class="accountbar"><div><h2>Customer leads</h2><p class="muted">Live D1-backed leads for this business.</p></div><div id="sub" class="status">Loading subscription…</div></div><div id="leads"><p class="muted">Loading…</p></div></section>
<section class="card"><h2>Add opportunity</h2><form id="leadForm"><input id="name" placeholder="Customer name" required><input id="contact" placeholder="Phone or email" required><input id="service" placeholder="Service needed" required><textarea id="notes" placeholder="What happened?"></textarea><button type="submit">Add to recovery desk</button></form><div id="formMsg" class="muted"></div></section>
</main>
<script>
const API="https://dealspark-test-api.pages.dev";
const key=localStorage.getItem("dealspark_dashboard_key");
const headers={"x-dealspark-key":key};
if(!key) location.href="signup.html";
async function load(){
 const r=await fetch(API+"/api/account",{headers}); const d=await r.json();
 if(!r.ok){localStorage.removeItem("dealspark_dashboard_key");location.href="signup.html";return}
 document.getElementById("bizName").textContent=d.business.name+" • "+d.business.phone;
 document.getElementById("sub").textContent=(d.subscription?.plan||"starter").toUpperCase()+" • "+(d.effective_status||d.subscription?.status||"setup"); const end=d.renewal_date?new Date(d.renewal_date):null; const days=d.days_until_renewal; const locked=d.locked; document.getElementById("activation").innerHTML=locked?"<b>🔒 DealSpark is locked.</b> Renew your subscription to restore access.":"<b>✓ Subscription active</b> <a href=\"onboarding.html\">Business setup & phone configuration →</a>"; document.getElementById("renewal").textContent=locked?"Payment required: renew your DealSpark subscription to unlock your apps.":(end&&days!==null?(days<=7?"Renewal reminder: your DealSpark subscription renews in "+days+" day(s) ("+end.toLocaleDateString()+").":"Renewal: "+days+" days remaining • "+end.toLocaleDateString()):"Renewal date will appear after Stripe activation."); document.getElementById("leadForm").style.display=locked?"none":"grid";
 const leads=d.leads||[]; document.getElementById("openCount").textContent=leads.filter(x=>x.status==="New"||x.status==="Follow-up").length;
 document.getElementById("qualifiedCount").textContent=leads.filter(x=>x.status==="Qualified").length;
 document.getElementById("bookedCount").textContent=leads.filter(x=>x.status==="Booked").length;
 document.getElementById("wonCount").textContent=leads.filter(x=>x.status==="Won").length;
 document.getElementById("leads").innerHTML=leads.length?leads.map(x=>'<div class="lead"><b>'+esc(x.name||"Unnamed lead")+'</b><span>'+esc(x.service||"General inquiry")+' • '+esc(x.status||"New")+'</span><div class="muted">'+esc(x.phone||x.email||"No contact")+' • '+new Date(x.created_at).toLocaleString()+'</div></div>').join(""):'<p class="muted">No leads yet. Add your first opportunity below.</p>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]||c))}
document.getElementById("leadForm").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,m=document.getElementById("formMsg");m.textContent="Saving…";const r=await fetch(API+"/api/leads",{method:"POST",headers:{...headers,"content-type":"application/json"},body:JSON.stringify({name:f.name.value,phone:f.contact.value,service:f.service.value,notes:f.notes.value,source:"dashboard"})});m.textContent=r.ok?"Lead added.":"Could not save lead.";if(r.ok){f.reset();load()}});
document.getElementById("logout").onclick=()=>{localStorage.removeItem("dealspark_dashboard_key");localStorage.removeItem("dealspark_business_id");location.href="signup.html"};
load();
</script><script>(function(){try{const sid=sessionStorage.getItem("ds_sid")||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());sessionStorage.setItem("ds_sid",sid);const ep="https://dealspark-analytics.singhdrona30.workers.dev";navigator.sendBeacon(ep,new Blob([JSON.stringify({event:"page_view",session_id:sid,page:location.pathname,referrer:document.referrer||"",ts:new Date().toISOString()})],{type:"application/json"}))}catch(e){}})();</script><script>(function(){try{const sid=sessionStorage.getItem("ds_sid")||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());sessionStorage.setItem("ds_sid",sid);const ep="https://dealspark-analytics.singhdrona30.workers.dev";const send=(event,target)=>navigator.sendBeacon(ep,new Blob([JSON.stringify({event,session_id:sid,page:location.pathname,referrer:document.referrer||"",target:String(target||"").slice(0,1000),ts:new Date().toISOString()})],{type:"application/json"}));document.addEventListener("click",function(e){const a=e.target.closest&&e.target.closest("a");if(a){const href=a.href||"";if(/signup\.html\?plan=|buy\.stripe\.com/.test(href))send("lead_click",href);else if(/ops-lab\/.*demo|chatbot\.html/.test(href))send("demo_click",href);return}const b=e.target.closest&&e.target.closest("button");if(b&&/run.*demo/i.test(b.textContent||""))send("demo_click",location.href+"#demo")},true);document.addEventListener("submit",function(e){if(e.target&&e.target.id==="signup"){const p=e.target.querySelector('[name="plan"]')?.value||"";send("lead_click","signup_submit:"+p)}},true)}catch(e){}})();</script></body></html>
